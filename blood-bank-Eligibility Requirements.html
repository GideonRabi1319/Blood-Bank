<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eligibility Requirements</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5 mb-5">
    <div class="card shadow">
      <div class="card-header bg-danger text-white text-center">
        <h3>Eligibility Requirements</h3>
      </div>
      <div class="card-body">
        <form action="connect4.php" method="post">
          <div class="mb-3">
            <label for="fullName" class="form-label">Full Name</label>
            <input type="text" class="form-control" name="fn" placeholder="Enter your name" required>
          </div>

          <div class="mb-3">
            <label for="age" class="form-label">Age</label>
            <input type="number" class="form-control" name="a" placeholder="Enter your age" min="18" max="65" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Weight (in kg)</label>
            <input type="number" class="form-control" name="w" placeholder="Must be 50 kg or more" min="50" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Are you currently healthy?</label><br>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="h" id="healthyYes" value="yes" required>
              <label class="form-check-label" for="healthyYes">Yes</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="h" id="healthyNo" value="no">
              <label class="form-check-label" for="healthyNo">No</label>
            </div>  
          </div>

          <div class="mb-3">
            <label class="form-label">Do you have any of the following?</label><br>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="disease" id="d1" value="Hepatitis" required>
              <label class="form-check-label" for="d1">Hepatitis</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="disease" id="d2" value="HIV/AIDS">
              <label class="form-check-label" for="d2">HIV/AIDS</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="disease" id="d3" value="Heart Condition">
              <label class="form-check-label" for="d3">Heart Condition</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="disease" id="d4" value="None of the above">
              <label class="form-check-label" for="d4">None of the above</label>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Have you donated blood in the last 3 months?</label>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="dr" id="donatedYes" value="yes" required>
              <label class="form-check-label" for="donatedYes">Yes</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="dr" id="donatedNo" value="no">
              <label class="form-check-label" for="donatedNo">No</label>
            </div>
          </div>

          <div class="text-center mt-4">
            <button type="submit" class="btn btn-danger">Check Eligibility</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
